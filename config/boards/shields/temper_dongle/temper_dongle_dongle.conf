# Dongle is always powered via USB, no need for sleep
CONFIG_ZMK_SLEEP=n

# USB output
CONFIG_ZMK_USB=y

# Two peripherals: left + right
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Larger queue for peripheral reconnection
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=10

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery reporting from peripherals
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
